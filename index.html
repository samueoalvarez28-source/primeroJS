<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS.1 PROJECT</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Library</h1>
            <button class="addbook">Add Book</button>
        </div>
        <form>
            <legend>Add Book</legend>
            <label for="title">Title</label>
            <input type="text" id="title" name="title">
            <label for="author">Author</label>
            <input type="text" id="author" name="author">
            <label for="pages">Pages</label>
            <input type="number" id="pages" name="pages">
            <label for="read">Read</label>
            <input type="checkbox" id="read" name="read">
            <button type="submit">Add Book</button>
            
        </form>
        <div class="content">
            
        </div>
        <div class="footer">
            <p>tngiage anigge sa inc©</p>
        </div>
    </div>
</body>
<script>
    const addBook = document.querySelector(".addbook");
    const form = document.querySelector("form");
    const content = document.querySelector(".content");

    addBook.addEventListener("click", () => {
        form.style.display = "flex";
        
    })
    form.addEventListener("submit", (e)=>{
        
        const title = document.getElementById("title").value;
        const author = document.getElementById("author").value;
        const pages = document.getElementById("pages").value;
        const read = document.getElementById("read").checked;
        const book = document.createElement("div");
        myLibrary.push(new Book(title, author, pages, read));
        console.log(myLibrary);
        book.classList.add("book");
        e.preventDefault();
        form.style.display = "none";
        render(book);
    })
    
    const myLibrary = [];

function Book(title, author, pages, read) {
  // the constructor...
  this.title = title;
  this.author = author;
  this.pages = pages;
  this.read = read;
  this.id = crypto.randomUUID()
}

function render(){
  content.innerHTML = "";
  myLibrary.forEach((book) => {
    const bookElement = document.createElement("div");
    content.appendChild(bookElement);
    bookElement.classList.add("book");
    bookElement.style.display = "flex";
    const ptitulo = document.createElement("p");
    ptitulo.textContent = "Title: "+book.title;
    bookElement.appendChild(ptitulo);
    const pauthor = document.createElement("p");
    pauthor.textContent = "Author: "+book.author;
    bookElement.appendChild(pauthor);
    const ppages = document.createElement("p");
    ppages.textContent = "Book pages: "+ book.pages;
    bookElement.appendChild(ppages);
    const pread = document.createElement("input");
    pread.type = "checkbox";
    pread.checked = book.read;
    bookElement.appendChild(pread);
    const button = document.createElement("button");
    button.textContent = "Remove";
    bookElement.appendChild(button);
    button.addEventListener("click", () => {
      bookElement.remove();
      myLibrary.splice(myLibrary.indexOf(book), 1)
    });
    content.appendChild(bookElement);
    });
}

function addBookToLibrary(Book) {
  // take params, create a book then
  // store it in the array
  myLibrary.push(Book);
}

const libro1 = new Book("the wealthy of nations", "Adam smith", 142, false);
const libro2 = new Book("Lord of the rings", "ni idea", 3040, true);
addBookToLibrary(libro1);
addBookToLibrary(libro2);
console.log(myLibrary);

</script>
</html>
